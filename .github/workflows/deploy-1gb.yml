name: Deploy to 1gb.ru

on:
  push:
    branches: [codexOPT, codexOpt3]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: FTP_SERVER
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build frontend
        run: |
          cd frontend
          npm ci
          npm run build

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Publish application
        run: |
          dotnet publish ProductionPlanner.csproj -c Release --self-contained true --runtime win-x86 -o ./publish

      - name: Copy frontend to wwwroot
        run: |
          mkdir -p publish/wwwroot
          cp -r frontend/dist/* publish/wwwroot/

      - name: Deploy via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.4
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          server-dir: ${{ secrets.FTP_SERVER_DIR }}
          local-dir: ./publish/
