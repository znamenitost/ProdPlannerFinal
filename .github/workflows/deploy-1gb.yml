name: Deploy to 1gb.ru

on:
  push:
    branches: [codexOPT, codexOpt3]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: FTP_SERVER
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build frontend
        run: |
          cd frontend
          npm ci
          npm run build

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Publish application
        run: |
          dotnet publish ProductionPlanner.csproj -c Release --self-contained true --runtime win-x86 -o ./publish

      - name: Copy frontend to wwwroot
        run: |
          mkdir -p publish/wwwroot
          cp -r frontend/dist/* publish/wwwroot/

      - name: Validate FTP secrets
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          missing=0
          [ -n "$FTP_SERVER" ] || { echo "::error::Секрет FTP_SERVER не задан в Environment FTP_SERVER"; missing=1; }
          [ -n "$FTP_USERNAME" ] || { echo "::error::Секрет FTP_USERNAME не задан в Environment FTP_SERVER"; missing=1; }
          [ -n "$FTP_PASSWORD" ] || { echo "::error::Секрет FTP_PASSWORD не задан в Environment FTP_SERVER"; missing=1; }
          [ "$missing" -eq 0 ] || exit 1

      - name: Prepare FTP target
        id: ftp
        run: |
          server="${{ secrets.FTP_SERVER }}"
          server="${server#ftp://}"
          server="${server#ftps://}"
          server="${server%%/*}"
          dir="${{ secrets.FTP_SERVER_DIR }}"
          if [ -z "$dir" ]; then
            dir="/http/"
            echo "FTP_SERVER_DIR не задан — используем /http/ (стандарт 1gb.ru)"
          fi
          case "$dir" in
            /*) ;;
            *) dir="/$dir" ;;
          esac
          echo "server=$server" >> "$GITHUB_OUTPUT"
          echo "server_dir=$dir" >> "$GITHUB_OUTPUT"

      - name: Deploy via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.4
        with:
          server: ${{ steps.ftp.outputs.server }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          server-dir: ${{ steps.ftp.outputs.server_dir }}
          local-dir: ./publish/
          protocol: ftp
          port: 21
