name: Deploy to 1gb.ru

on:
  push:
    branches: [codexOPT, codexOpt3]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: FTP_SERVER
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build frontend
        run: |
          cd frontend
          npm ci
          npm run build

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Publish application
        run: |
          # win-x86: на shared IIS часто пул 32-bit (ошибка 500.32 при x64)
          dotnet publish ProductionPlanner.csproj -c Release --self-contained true --runtime win-x86 -o ./publish

      - name: Copy frontend to wwwroot
        run: |
          mkdir -p publish/wwwroot publish/logs publish/App_Data
          cp -r frontend/dist/* publish/wwwroot/
          test -f publish/wwwroot/index.html

      - name: Configure PostgreSQL connection for production
        env:
          POSTGRES_CONNECTION_STRING: ${{ secrets.POSTGRES_CONNECTION_STRING }}
        run: |
          if [ -z "$POSTGRES_CONNECTION_STRING" ]; then
            echo "::warning::Секрет POSTGRES_CONNECTION_STRING не задан — на сервере останется SQLite (App_Data) или пустая строка в appsettings"
            exit 0
          fi
          python3 << 'PY'
          import json, os, re

          def normalize_1gb(conn: str) -> str:
              conn = conn.strip()
              if "SSL Mode" not in conn and "Ssl Mode" not in conn:
                  conn += ";SSL Mode=Disable"
              if "Timeout" not in conn:
                  conn += ";Timeout=30"
              if "Command Timeout" not in conn:
                  conn += ";Command Timeout=60"
              return conn

          def escape_xml_attr(value: str) -> str:
              return (
                  value.replace("&", "&amp;")
                  .replace('"', "&quot;")
                  .replace("<", "&lt;")
              )

          conn = normalize_1gb(os.environ["POSTGRES_CONNECTION_STRING"])

          path = "publish/appsettings.Production.json"
          with open(path, encoding="utf-8") as f:
              cfg = json.load(f)
          cfg.setdefault("ConnectionStrings", {})["DefaultConnection"] = conn
          with open(path, "w", encoding="utf-8") as f:
              json.dump(cfg, f, indent=2, ensure_ascii=False)
              f.write("\n")
          print("appsettings.Production.json: connection string записан (SSL Mode=Disable для 1gb)")

          web_config = "publish/web.config"
          with open(web_config, encoding="utf-8") as f:
              xml = f.read()

          env_line = (
              '          <environmentVariable name="ConnectionStrings__DefaultConnection" '
              f'value="{escape_xml_attr(conn)}" />'
          )

          if "ConnectionStrings__DefaultConnection" in xml:
              xml = re.sub(
                  r'<environmentVariable name="ConnectionStrings__DefaultConnection" value="[^"]*"\s*/>',
                  env_line.strip(),
                  xml,
                  count=1,
              )
          else:
              xml = xml.replace(
                  '<environmentVariable name="ASPNETCORE_ENVIRONMENT" value="Production" />',
                  '<environmentVariable name="ASPNETCORE_ENVIRONMENT" value="Production" />\n' + env_line,
              )

          with open(web_config, "w", encoding="utf-8") as f:
              f.write(xml)
          print("web.config: ConnectionStrings__DefaultConnection добавлен")

          host = ""
          for part in conn.split(";"):
              if part.strip().lower().startswith("host="):
                  host = part.split("=", 1)[1].strip()
                  break
          print(f"Проверка: Host={host or '?'}")
          PY

      - name: Validate FTP secrets
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          missing=0
          [ -n "$FTP_SERVER" ] || { echo "::error::Секрет FTP_SERVER не задан"; missing=1; }
          [ -n "$FTP_USERNAME" ] || { echo "::error::Секрет FTP_USERNAME не задан"; missing=1; }
          [ -n "$FTP_PASSWORD" ] || { echo "::error::Секрет FTP_PASSWORD не задан"; missing=1; }
          [ "$missing" -eq 0 ] || exit 1

      - name: Prepare FTP target
        id: ftp
        run: |
          server="${{ secrets.FTP_SERVER }}"
          server="${server#ftp://}"
          server="${server#ftps://}"
          server="${server%%/*}"
          # На 1gb.ru корень сайта всегда /http/ (не /site/ как на SmarterASP)
          dir="/http/"
          echo "FTP target: ${server}${dir}"
          echo "server=$server" >> "$GITHUB_OUTPUT"
          echo "server_dir=$dir" >> "$GITHUB_OUTPUT"

      - name: Deploy via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.4
        with:
          server: ${{ steps.ftp.outputs.server }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          server-dir: ${{ steps.ftp.outputs.server_dir }}
          local-dir: ./publish/
          protocol: ftp
          port: 21
          log-level: verbose
          exclude: |
            **/.git*
            **/.github/**
            App_Data/*.db-shm
            App_Data/*.db-wal
