name: Deploy to 1gb.ru

on:
  push:
    branches: [codexOPT, codexOpt3, codexOpt4, codexOpt5, codexOPT7, codexOPT8]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    environment:
      name: FTP_SERVER
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          package-manager-cache: false

      - name: Build frontend
        run: |
          cd frontend
          rm -rf dist
          npm ci
          npm run build
          grep -q "Действия с задачей" dist/assets/*.js
          grep -q "Общая задача" dist/assets/*.js
          echo "UX bundle verified in $(ls dist/assets/index-*.js)"

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Apply PostgreSQL schema (EF migrations)
        env:
          POSTGRES_CONNECTION_STRING: ${{ secrets.POSTGRES_CONNECTION_STRING }}
        run: |
          if [ -z "$POSTGRES_CONNECTION_STRING" ]; then
            echo "::error::POSTGRES_CONNECTION_STRING не задан"
            exit 1
          fi
          export ConnectionStrings__DefaultConnection="$POSTGRES_CONNECTION_STRING"
          dotnet run --project ProductionPlanner.csproj -c Release --no-launch-profile -- apply-migrations

      - name: Publish application
        run: |
          # win-x86 + FDD: пул IIS 32-bit, .NET 10 x86 на сервере. web.config — outofprocess + dotnet.dll.
          dotnet publish ProductionPlanner.csproj -c Release --runtime win-x86 --self-contained false /p:ReadyToRun=true -o ./publish

      - name: Copy frontend to wwwroot
        run: |
          mkdir -p publish/wwwroot
          rm -rf publish/wwwroot/assets publish/wwwroot/index.html
          cp -r frontend/dist/* publish/wwwroot/
          mkdir -p publish/wwwroot/sprites
          cp sprites/fon1.svg sprites/fon2.svg sprites/fon3.svg sprites/fon5.svg sprites/sun.svg publish/wwwroot/sprites/
          test -f publish/wwwroot/index.html
          grep -q "Действия с задачей" publish/wwwroot/assets/*.js
          JS=$(basename "$(ls publish/wwwroot/assets/index-*.js)")
          echo "wwwroot bundle: $JS"
          {
            echo "branch=${{ github.ref_name }}"
            echo "sha=${{ github.sha }}"
            echo "bundle=$JS"
            echo "features=ux-menu,two-line-titles,shared-task-icon,migrations-ci"
          } | tee publish/deploy-version.txt > publish/wwwroot/deploy-version.txt
          sed -i "s|</head>|  <!-- deploy-sha:${{ github.sha }} bundle:$JS --></head>|" publish/wwwroot/index.html
          # logs/ и App_Data/ не включаем в FTP — на сервере 550 при перезаписи занятых папок

      - name: Configure PostgreSQL connection for production
        env:
          POSTGRES_CONNECTION_STRING: ${{ secrets.POSTGRES_CONNECTION_STRING }}
        run: |
          if [ -z "$POSTGRES_CONNECTION_STRING" ]; then
            echo "::error::Секрет POSTGRES_CONNECTION_STRING не задан в environment FTP_SERVER"
            exit 1
          fi
          python3 << 'PY'
          import json, os

          def normalize_1gb(conn: str) -> str:
              conn = conn.strip().strip('"').strip("'")
              parts = {}

              if ";" in conn:
                  for item in conn.split(";"):
                      item = item.strip()
                      if "=" not in item:
                          continue
                      k, v = item.split("=", 1)
                      parts[k.strip().lower()] = v.strip().strip('"').strip("'")
              elif " " in conn and "=" in conn:
                  for token in conn.split():
                      if "=" not in token:
                          continue
                      k, v = token.split("=", 1)
                      parts[k.strip().lower()] = v.strip().strip('"').strip("'")
              else:
                  raise SystemExit("Строка подключения должна быть вида Host=...;Port=5432;Database=...;Username=...;Password=...")

              keymap = {
                  "host": "host",
                  "port": "port",
                  "database": "database",
                  "dbname": "database",
                  "username": "username",
                  "user": "username",
                  "user id": "username",
                  "password": "password",
              }
              mapped = {}
              for k, v in parts.items():
                  mk = keymap.get(k)
                  if mk:
                      mapped[mk] = v

              host = mapped.get("host", "")
              if not host or " " in host or "=" in host:
                  raise SystemExit(f"Некорректный Host в секрете: {host!r}. Только имя сервера, без пробелов.")

              out = [
                  f"Host={host}",
                  f"Port={mapped.get('port', '5432')}",
                  f"Database={mapped['database']}",
                  f"Username={mapped['username']}",
                  f"Password={mapped['password']}",
                  "SSL Mode=Disable",
                  "Timeout=30",
                  "Command Timeout=60",
              ]
              return ";".join(out)

          conn = normalize_1gb(os.environ["POSTGRES_CONNECTION_STRING"])

          path = "publish/appsettings.Production.json"
          with open(path, encoding="utf-8") as f:
              cfg = json.load(f)
          cfg.setdefault("ConnectionStrings", {})["DefaultConnection"] = conn
          with open(path, "w", encoding="utf-8") as f:
              json.dump(cfg, f, indent=2, ensure_ascii=False)
              f.write("\n")
          print("appsettings.Production.json: connection string записан (SSL Mode=Disable для 1gb)")
          # web.config не трогаем — IIS часто держит файл открытым (FTP 550)

          host = ""
          for part in conn.split(";"):
              if part.strip().lower().startswith("host="):
                  host = part.split("=", 1)[1].strip()
                  break
          print(f"Проверка: Host={host or '?'}")
          PY

      - name: Validate FTP secrets
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          missing=0
          [ -n "$FTP_SERVER" ] || { echo "::error::Секрет FTP_SERVER не задан"; missing=1; }
          [ -n "$FTP_USERNAME" ] || { echo "::error::Секрет FTP_USERNAME не задан"; missing=1; }
          [ -n "$FTP_PASSWORD" ] || { echo "::error::Секрет FTP_PASSWORD не задан"; missing=1; }
          [ "$missing" -eq 0 ] || exit 1

      - name: Prepare FTP target
        id: ftp
        run: |
          server="${{ secrets.FTP_SERVER }}"
          server="${server#ftp://}"
          server="${server#ftps://}"
          server="${server%%/*}"
          # На 1gb.ru корень сайта обычно /http/ (можно переопределить секретом FTP_SERVER_DIR)
          dir="${{ secrets.FTP_SERVER_DIR }}"
          if [ -z "$dir" ]; then
            dir="/http/"
          fi
          case "$dir" in
            */) ;;
            *) dir="${dir}/" ;;
          esac
          echo "FTP target: ${server}${dir}"
          echo "server=$server" >> "$GITHUB_OUTPUT"
          echo "server_dir=$dir" >> "$GITHUB_OUTPUT"

      - name: Install lftp
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lftp

      - name: Test FTP login
        env:
          FTP_SERVER: ${{ steps.ftp.outputs.server }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_DIR: ${{ steps.ftp.outputs.server_dir }}
        run: |
          lftp -e "set ftp:passive-mode on; set ssl:force off; open -u '${{ secrets.FTP_USERNAME }}','${{ secrets.FTP_PASSWORD }}' ${{ steps.ftp.outputs.server }}; ls '${{ steps.ftp.outputs.server_dir }}'; bye"

      - name: Stop IIS (app_offline.htm)
        env:
          FTP_SERVER: ${{ steps.ftp.outputs.server }}
          FTP_DIR: ${{ steps.ftp.outputs.server_dir }}
        run: |
          echo '<!DOCTYPE html><html><body><p>Обновление приложения…</p></body></html>' > app_offline.htm
          lftp -e "set ftp:passive-mode on; set ssl:force off; open -u '${{ secrets.FTP_USERNAME }}','${{ secrets.FTP_PASSWORD }}' ${{ steps.ftp.outputs.server }}; cd '${{ steps.ftp.outputs.server_dir }}'; put app_offline.htm; bye"
          echo "Ждём остановку пула IIS (30 с)…"
          sleep 30

      - name: Reset FTP sync and stale frontend entrypoints
        run: |
          lftp -e "
            set ftp:passive-mode on;
            set ssl:force off;
            open -u '${{ secrets.FTP_USERNAME }}','${{ secrets.FTP_PASSWORD }}' ${{ steps.ftp.outputs.server }};
            cd '${{ steps.ftp.outputs.server_dir }}';
            rm -f .ftp-deploy-sync-state.json;
            rm -f wwwroot/index.html;
            glob -a rm -f wwwroot/assets/*;
            bye
          " || echo "::warning::Не удалось очистить wwwroot на FTP — продолжаем деплой"

      - name: Deploy via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ${{ steps.ftp.outputs.server }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          server-dir: ${{ steps.ftp.outputs.server_dir }}
          local-dir: ./publish/
          protocol: ftp
          port: 21
          security: loose
          log-level: verbose
          timeout: 120000
          exclude: |
            **/.git*
            **/.github/**
            **/logs/**
            **/App_Data/**
            **/*.db
            **/*.db-shm
            **/*.db-wal
            **/*.pdb
            app_offline.htm

      - name: Start IIS (remove app_offline.htm)
        if: always()
        run: |
          lftp -e "set ftp:passive-mode on; set ssl:force off; open -u '${{ secrets.FTP_USERNAME }}','${{ secrets.FTP_PASSWORD }}' ${{ steps.ftp.outputs.server }}; cd '${{ steps.ftp.outputs.server_dir }}'; rm -f app_offline.htm; bye" || {
            echo "::warning::Не удалось удалить app_offline.htm — удалите вручную в /http/ через FileZilla"
          }

      - name: Deploy summary
        run: |
          JS=$(basename "$(ls publish/wwwroot/assets/index-*.js)")
          echo "## Deployed bundle" >> "$GITHUB_STEP_SUMMARY"
          echo "- sha: \`${{ github.sha }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- js: \`$JS\`" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Проверка на проде (после зелёного job):" >> "$GITHUB_STEP_SUMMARY"
          echo "1. http://team-mainb6d.1gb.ru/wwwroot/deploy-version.txt" >> "$GITHUB_STEP_SUMMARY"
          echo "2. http://team-mainb6d.1gb.ru/api/deploy-info" >> "$GITHUB_STEP_SUMMARY"
          echo "3. View Source главной — комментарий \`deploy-sha:${{ github.sha }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "4. Ctrl+Shift+R; меню ⋮ — вкладка **Таблица задач** (роль Admin или своя задача)" >> "$GITHUB_STEP_SUMMARY"
