name: Deploy to 1gb.ru

on:
  push:
    branches: [codexOPT, codexOpt3]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: FTP_SERVER
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build frontend
        run: |
          cd frontend
          npm ci
          npm run build

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Publish application
        run: |
          # win-x86: на shared IIS часто пул 32-bit (ошибка 500.32 при x64)
          dotnet publish ProductionPlanner.csproj -c Release --self-contained true --runtime win-x86 -o ./publish

      - name: Copy frontend to wwwroot
        run: |
          mkdir -p publish/wwwroot publish/logs publish/App_Data
          cp -r frontend/dist/* publish/wwwroot/
          test -f publish/wwwroot/index.html

      - name: Validate FTP secrets
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          missing=0
          [ -n "$FTP_SERVER" ] || { echo "::error::Секрет FTP_SERVER не задан"; missing=1; }
          [ -n "$FTP_USERNAME" ] || { echo "::error::Секрет FTP_USERNAME не задан"; missing=1; }
          [ -n "$FTP_PASSWORD" ] || { echo "::error::Секрет FTP_PASSWORD не задан"; missing=1; }
          [ "$missing" -eq 0 ] || exit 1

      - name: Prepare FTP target
        id: ftp
        run: |
          server="${{ secrets.FTP_SERVER }}"
          server="${server#ftp://}"
          server="${server#ftps://}"
          server="${server%%/*}"
          # На 1gb.ru корень сайта всегда /http/ (не /site/ как на SmarterASP)
          dir="/http/"
          echo "FTP target: ${server}${dir}"
          echo "server=$server" >> "$GITHUB_OUTPUT"
          echo "server_dir=$dir" >> "$GITHUB_OUTPUT"

      - name: Deploy via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.4
        with:
          server: ${{ steps.ftp.outputs.server }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          server-dir: ${{ steps.ftp.outputs.server_dir }}
          local-dir: ./publish/
          protocol: ftp
          port: 21
          log-level: verbose
          exclude: |
            **/.git*
            **/.github/**
            App_Data/*.db-shm
            App_Data/*.db-wal
