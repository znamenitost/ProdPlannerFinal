<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <title>CDR preview test (удалить потом)</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 640px; margin: 2rem auto; padding: 0 1rem; }
    img { max-width: 100%; border: 1px solid #ccc; margin-top: 1rem; display: block; }
    pre { background: #f4f4f4; padding: 0.75rem; font-size: 13px; overflow: auto; white-space: pre-wrap; }
    .err { color: #c00; }
    .ok { color: #060; }
  </style>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
</head>
<body>
  <h1>Тест превью .cdr</h1>
  <p>Выберите файл с Desktop — без сервера, только браузер.</p>
  <input type="file" accept=".cdr" id="pick" />
  <pre id="log">Ожидание файла…</pre>
  <img id="preview" alt="" hidden />

  <script>
    const log = (msg, cls) => {
      const el = document.getElementById('log');
      el.textContent = msg;
      el.className = cls || '';
    };

    const readU32 = (view, offset) => view.getUint32(offset, true);

    function imageMime(data) {
      if (data[0] === 0x89 && data[1] === 0x50 && data[2] === 0x4e && data[3] === 0x47) return 'image/png';
      if (data[0] === 0x42 && data[1] === 0x4d) return 'image/bmp';
      if (data[0] === 0xff && data[1] === 0xd8) return 'image/jpeg';
      return 'application/octet-stream';
    }

    function findBmpInBuffer(bytes, maxScan) {
      const limit = Math.min(maxScan ?? bytes.length, bytes.length);
      const view = new DataView(bytes.buffer, bytes.byteOffset, bytes.byteLength);
      for (let i = 0; i < limit - 6; i++) {
        if (bytes[i] === 0x42 && bytes[i + 1] === 0x4d) {
          const size = view.getInt32(i + 2, true);
          if (size > 1000 && size < bytes.length - i) {
            return { data: bytes.slice(i, i + size), method: `BM scan @ offset ${i}, ${size} bytes` };
          }
        }
      }
      return null;
    }

    /** RIFF DISP chunk — indexed palette thumbnail (старые .cdr). */
    function extractFromDisp(bytes) {
      if (bytes.length < 12) return null;
      if (bytes[0] !== 0x52 || bytes[1] !== 0x49 || bytes[2] !== 0x46 || bytes[3] !== 0x46) return null;

      const view = new DataView(bytes.buffer, bytes.byteOffset, bytes.byteLength);
      let offset = 12;

      while (offset + 8 <= bytes.length) {
        const id = String.fromCharCode(bytes[offset], bytes[offset + 1], bytes[offset + 2], bytes[offset + 3]);
        const size = readU32(view, offset + 4);
        const dataStart = offset + 8;
        const dataEnd = dataStart + size;

        if (id === 'DISP' && dataEnd <= bytes.length && size > 44) {
          const w = readU32(view, dataStart + 8);
          const h = readU32(view, dataStart + 12);
          const paletteStart = dataStart + 8 + 4 + 4 + 28;
          const pixelsStart = paletteStart + 1024;

          if (w > 0 && h > 0 && w < 4096 && h < 4096 && pixelsStart + w * h <= dataEnd) {
            const rgba = new Uint8ClampedArray(w * h * 4);
            for (let p = 0; p < w * h; p++) {
              const idx = bytes[pixelsStart + p] * 4;
              const o = p * 4;
              rgba[o] = bytes[paletteStart + idx + 2];
              rgba[o + 1] = bytes[paletteStart + idx + 1];
              rgba[o + 2] = bytes[paletteStart + idx];
              rgba[o + 3] = 255;
            }

            const canvas = document.createElement('canvas');
            canvas.width = w;
            canvas.height = h;
            canvas.getContext('2d').putImageData(new ImageData(rgba, w, h), 0, 0);

            return {
              canvas,
              method: `RIFF DISP chunk ${w}×${h}`
            };
          }
        }

        offset = dataEnd + (size % 2);
        if (offset <= 12) break;
      }

      return null;
    }

    const ZIP_PREVIEW_PATTERNS = [
      /^previews\/thumbnail\.png$/i,
      /^metadata\/thumbnails\/thumbnail\.bmp$/i,
      /^previews\/thumbnail\.bmp$/i,
      /^metadata\/thumbnails\/thumbnail\.png$/i,
      /^previews\/page1\.png$/i,
      /^metadata\/thumbnails\/page1\.bmp$/i,
      /thumbnail.*\.(png|bmp|jpg|jpeg)$/i
    ];

    async function fromZip(bytes) {
      const zip = await JSZip.loadAsync(bytes);
      const names = Object.keys(zip.files).filter((n) => !zip.files[n].dir);

      for (const pattern of ZIP_PREVIEW_PATTERNS) {
        const name = names.find((n) => pattern.test(n));
        if (!name) continue;
        const data = await zip.file(name).async('uint8array');
        if (data.length > 100) {
          return { data, method: `ZIP: ${name} (${data.length} bytes)` };
        }
      }

      return { error: `В ZIP нет превью. Записи:\n${names.join('\n')}` };
    }

    function showPreviewFromBytes(data, method) {
      const mime = imageMime(data);
      const blob = new Blob([data], { type: mime });
      const url = URL.createObjectURL(blob);
      const img = document.getElementById('preview');
      img.src = url;
      img.hidden = false;
      log(`OK\n${method}\nТип: ${mime}\nПревью ниже.`, 'ok');
    }

    function showPreviewFromCanvas(canvas, method) {
      const img = document.getElementById('preview');
      img.src = canvas.toDataURL('image/png');
      img.hidden = false;
      log(`OK\n${method}\nПревью ниже.`, 'ok');
    }

    document.getElementById('pick').addEventListener('change', async (e) => {
      const file = e.target.files?.[0];
      document.getElementById('preview').hidden = true;

      if (!file) return;

      log(`Читаю: ${file.name} (${(file.size / 1024 / 1024).toFixed(2)} MB)…`);

      const bytes = new Uint8Array(await file.arrayBuffer());
      const head = bytes.slice(0, 4);
      const hex = [...head].map((b) => b.toString(16).padStart(2, '0')).join(' ');

      if (bytes[0] === 0x50 && bytes[1] === 0x4b) {
        log(`ZIP (Corel X4+)\nПервые байты: ${hex}\nИщу previews/thumbnail.png и др.…`);
        try {
          const zipResult = await fromZip(bytes);
          if (zipResult.data) {
            showPreviewFromBytes(zipResult.data, zipResult.method);
            return;
          }
          log(zipResult.error || 'Превью в ZIP не найдено', 'err');
        } catch (err) {
          log(`ZIP ошибка: ${err.message}`, 'err');
        }
        return;
      }

      if (bytes[0] === 0x52 && bytes[1] === 0x49 && bytes[2] === 0x46 && bytes[3] === 0x46) {
        log(`RIFF (старый Corel)\nПервые байты: ${hex}\nПарсю DISP…`);

        const disp = extractFromDisp(bytes);
        if (disp) {
          showPreviewFromCanvas(disp.canvas, disp.method);
          return;
        }

        log('DISP не найден, сканирую BMP в первых 256 KB…');
        const bmp = findBmpInBuffer(bytes, 256 * 1024);
        if (bmp) {
          showPreviewFromBytes(bmp.data, bmp.method);
          return;
        }
      } else {
        log(`Заголовок: ${hex}\nПробую BM scan…`);
        const bmp = findBmpInBuffer(bytes, 256 * 1024);
        if (bmp) {
          showPreviewFromBytes(bmp.data, bmp.method);
          return;
        }
      }

      log('Превью не найдено.', 'err');
    });
  </script>
</body>
</html>
